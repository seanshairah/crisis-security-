<!doctype html><html><head><meta charset="utf-8"><title>Crisis Security - Sample QR Signs</title><style>body{font:15px system-ui;color:#222;margin:24px}header{background:#30383b;color:#fff;padding:24px}h1{margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:25px}.card{text-align:center;border:2px solid #333;padding:24px;break-inside:avoid}.card img{width:190px;height:190px;image-rendering:pixelated}.card p{font-size:12px}button{padding:10px 20px;margin-top:14px}@media print{button{display:none}.grid{margin-top:10px}header{color:#000;background:white}}</style></head><body><header><h1>CRISIS SECURITY · CHECKPOINT SIGNS</h1><p>DEVELOPMENT SAMPLES ONLY — NOT VALID ON REAL SECURITY SITES</p></header><button onclick="print()">Print sample checkpoint signs</button><div class="grid"><div class="card"><h2>Main Gate</h2><img src="qr-gate.png" alt="QR sample for Main Gate"><p>CRISIS-DEMO:gate</p></div><div class="card"><h2>Northern Fence</h2><img src="qr-fence.png" alt="QR sample for Northern Fence"><p>CRISIS-DEMO:fence</p></div><div class="card"><h2>Loading Bay</h2><img src="qr-loading.png" alt="QR sample for Loading Bay"><p>CRISIS-DEMO:loading</p></div><div class="card"><h2>Rear Entrance</h2><img src="qr-rear.png" alt="QR sample for Rear Entrance"><p>CRISIS-DEMO:rear</p></div><div class="card"><h2>Perimeter Corner</h2><img src="qr-corner.png" alt="QR sample for Perimeter Corner"><p>CRISIS-DEMO:corner</p></div></div></body></html>
