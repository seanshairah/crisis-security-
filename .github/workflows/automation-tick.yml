# Five-minute fallback only. Use the in-process scheduler or a minute-capable cron for patrol timing.
# GitHub schedules can lag by several minutes; cron-job.org or Upstash QStash are more punctual.
# Set repository secrets: APP_URL (https://your-domain) and AUTOMATION_SECRET.
concurrency:
  group: crisis-automation-tick
  cancel-in-progress: false
name: Automation tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    # Enable only after configuring this repository's separate Crisis endpoint and secrets.
    if: ${{ vars.CRISIS_AUTOMATION_ENABLED == 'true' }}
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - name: Call the engine
        env:
          APP_URL: ${{ secrets.APP_URL }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$AUTOMATION_SECRET" ]; then
            echo "APP_URL or AUTOMATION_SECRET is not set; skipping the tick."
            exit 0
          fi
          curl -fsS --max-time 50 -X POST "$APP_URL/api/automation/tick" -H "Authorization: Bearer $AUTOMATION_SECRET"
