# Re-records the Android layout snapshots after a visual change. Run by hand (Actions -> Record Android
# screenshots, choose the branch). It commits the new images to that branch, so they show up in the pull
# request's diff for a person to look at before merging, and uploads them as an artifact too.
name: Record Android screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record snapshots
        run: ./android/gradlew -p android -Pscreenshots :app:recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-snapshots
          path: android/app/src/test/snapshots/images
          if-no-files-found: error
      - name: Commit the new images to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/test/snapshots/images
          if git diff --cached --quiet; then echo "Snapshots unchanged."; exit 0; fi
          git commit -m "Re-record Android layout snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
